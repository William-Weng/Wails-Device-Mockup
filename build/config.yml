version: '3'

info:
  companyName: "William-Weng"
  productName: "Device Mockup"
  productIdentifier: "idv.williamweng.wails-device-mockup"
  description: "一個將影片與圖片外框結合的小工具"
  copyright: "Copyright © 2026, William Weng"
  comments: "Built with Wails, Go, Svelte and FFmpeg"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:

other:
  - name: My Other Data
